  startedAt: DateTime!
  finishedAt: DateTime
}

type AgentRunEdge {
  cursor: String!
  node: AgentRun!
}

type AgentRunConnection {
  edges: [AgentRunEdge!]!
  pageInfo: PageInfo!
}

"""Salud de un servicio."""
type ServiceHealth {
  name: String!
  status: ServiceStatus!
  latencyMs: Int
  "Resultado por dependencia, p. ej. `{\"db\": \"UP\", \"broker\": \"UP\"}`."
  checks: JSON
  error: String
}

"""Estado de una cola de RabbitMQ."""
type QueueHealth {
  name: String!
  messagesReady: Long!
  messagesUnacked: Long!
  consumers: Int!
  isDeadLetter: Boolean!
}

"""Salud agregada de la plataforma."""
type ServiceHealthReport {
  checkedAt: DateTime!
  overall: ServiceStatus!
  services: [ServiceHealth!]!
  queues: [QueueHealth!]!
}

