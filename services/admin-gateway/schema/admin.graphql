  newUsers: Long!
  posts: Long!
  comments: Long!
  reactions: Long!
  registrationsConfirmed: Long!
  registrationsFailed: Long!
  registrationsCancelled: Long!
  creditsToppedUp: Long!
  creditsSpent: Long!
  flaggedContent: Long!
  openAlerts: Long!
