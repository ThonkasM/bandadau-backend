}

type SuspendUserPayload {
  user: User
  errors: [UserError!]!
}

input ReactivateUserInput {
  userId: UUID!
  note: String
}

type ReactivateUserPayload {
  user: User
  errors: [UserError!]!
}

input CreateUniversityInput {
  name: String!
  allowedDomains: [String!]!
}

type CreateUniversityPayload {
  university: University
  errors: [UserError!]!
}

type ModerateMediaPayload {
  media: MediaAsset
  errors: [UserError!]!
}

input ResolveContentReportInput {
  reportId: UUID!
  resolution: ReportResolution!
  note: String
}

type ResolveContentReportPayload {
  report: ContentReport
  errors: [UserError!]!
}

type RequestReportPayload {
  report: GeneratedReport
  errors: [UserError!]!
}

type AcknowledgeAlertPayload {
  alert: Alert
  errors: [UserError!]!
}

type RunMonitoringPayload {
  agentRun: AgentRun
  errors: [UserError!]!
}

type RetrySagaPayload {
  "SAGA reanudada (o su estado actual si ya no estaba FAILED)."
  saga: SagaInstance
  errors: [UserError!]!
}

input CreateMcpTokenInput {
  "Nombre descriptivo para reconocer el token (p. ej. `Claude Desktop — laptop de Ana`)."
  label: String
}

"""
Token para clientes MCP externos (D9, ADR-0016): JWT de 8 h con `aud=mcp` y scope `mcp:tools`,
emitido por identity (`createMcpToken`). `accessToken` solo se devuelve en la mutación que lo crea.
"""
type McpToken {
  id: UUID!
  "JWT del token; se muestra una sola vez."
  accessToken: String!
  audience: String!
  scopes: [String!]!
  label: String
  expiresAt: DateTime!
  createdAt: DateTime!
}

type CreateMcpTokenPayload {
  token: McpToken
  errors: [UserError!]!
}

type RevokeMcpTokenPayload {
  "Id del token revocado."
  revokedId: UUID
  errors: [UserError!]!
}

# -----------------------------------------------------------------------------
# Tipos raíz (D11)
# -----------------------------------------------------------------------------

type Query {
  """Usuario autenticado en el panel."""
  me: User! @auth(requires: [MODERATOR, ADMIN])

  """KPIs y series de la plataforma en un rango."""
  dashboard(range: DateRangeInput!): Dashboard! @auth(requires: [ADMIN])

  """Búsqueda paginada de usuarios."""
  users(filter: UserFilter, after: String, first: Int = 20): UserConnection! @auth(requires: [ADMIN])

  """Usuario por id."""
  user(id: UUID!): User @auth(requires: [MODERATOR, ADMIN])

  """Universidades habilitadas."""
  universities: [University!]! @auth(requires: [ADMIN])

  """Cola de moderación (medios marcados por IA y posts ocultos por denuncias)."""
  moderationQueue(filter: ModerationQueueFilter, after: String, first: Int = 20): ModerationItemConnection!
    @auth(requires: [MODERATOR, ADMIN])

  """Denuncias de contenido."""
  contentReports(
    "Por defecto OPEN."
    status: ReportStatus = OPEN
    targetType: ContentReportTargetType
    "Máximo de elementos (1–50)."
    first: Int = 50
  ): [ContentReport!]! @auth(requires: [MODERATOR, ADMIN])

  """Eventos según filtro."""
  events(
    filter: EventFilter
    "Máximo de elementos (1–50)."
    first: Int = 50
  ): [Event!]! @auth(requires: [ADMIN])

  """Evento por id."""
  event(id: UUID!): Event @auth(requires: [ADMIN])

  """Inscripciones de un evento."""
  registrations(
    eventId: UUID!
    status: RegistrationStatus
    "Máximo de elementos (1–50)."
    first: Int = 50
  ): [Registration!]! @auth(requires: [ADMIN])

  """SAGAs por estado (p. ej. FAILED o COMPENSATED)."""
  sagas(
    status: SagaStatus
    type: SagaType
    "Solo SAGAs actualizadas desde este instante."
    since: DateTime
    "Máximo de elementos (1–50)."
    first: Int = 50
  ): [SagaInstance!]! @auth(requires: [ADMIN])

  """Estadísticas de créditos."""
  walletStats(range: DateRangeInput!): WalletStats! @auth(requires: [ADMIN])

  """Reportes generativos (más recientes primero)."""
  reports(
    after: String
    "Tamaño de página Relay (1–50)."
    first: Int = 20
    status: GeneratedReportStatus
  ): GeneratedReportConnection! @auth(requires: [ADMIN])

  """Reporte por id."""
  report(id: UUID!): GeneratedReport @auth(requires: [ADMIN])

  """Alertas por estado."""
  alerts(
    status: AlertStatus
    severity: AlertSeverity
    "Máximo de elementos (1–50)."
    first: Int = 50
  ): [Alert!]! @auth(requires: [ADMIN])

  """Ejecuciones de agentes (más recientes primero)."""
  agentRuns(
    after: String
    "Tamaño de página Relay (1–50)."
    first: Int = 20
    agent: AgentKind
  ): AgentRunConnection! @auth(requires: [ADMIN])

  """Salud de servicios, colas y DLQ."""
  serviceHealth: ServiceHealthReport! @auth(requires: [ADMIN])
}

type Mutation {
  """Reemplaza los roles de un usuario."""
  updateUserRoles(input: UpdateUserRolesInput!): UpdateUserRolesPayload! @auth(requires: [ADMIN])

  """Suspende una cuenta (revoca sus sesiones)."""
  suspendUser(input: SuspendUserInput!): SuspendUserPayload! @auth(requires: [MODERATOR, ADMIN])

  """Reactiva una cuenta suspendida."""
  reactivateUser(input: ReactivateUserInput!): ReactivateUserPayload! @auth(requires: [ADMIN])

  """Habilita una universidad nueva."""
  createUniversity(input: CreateUniversityInput!): CreateUniversityPayload! @auth(requires: [ADMIN])

  """Aprueba o rechaza un medio marcado."""
  moderateMedia(id: UUID!, decision: MediaReviewDecision!, note: String): ModerateMediaPayload!
    @auth(requires: [MODERATOR, ADMIN])

  """Resuelve una denuncia de contenido."""
  resolveContentReport(input: ResolveContentReportInput!): ResolveContentReportPayload!
    @auth(requires: [MODERATOR, ADMIN])

  """Solicita un reporte generativo; el idioma por defecto es el del usuario (D14)."""
  requestReport(question: String!, locale: Locale): RequestReportPayload! @auth(requires: [ADMIN])

  """Reconoce una alerta."""
  acknowledgeAlert(id: UUID!): AcknowledgeAlertPayload! @auth(requires: [ADMIN])

  """Ejecuta el agente de monitoreo inmediatamente."""
  runMonitoringNow: RunMonitoringPayload! @auth(requires: [ADMIN])

  """
  Reimpulsa una SAGA `FAILED` desde el paso en que quedó (events `retrySaga`, D15, UC-13).
  Errores de negocio: `SAGA_NOT_RETRYABLE`, `NOT_FOUND`.
  """
  retrySaga(id: UUID!): RetrySagaPayload! @auth(requires: [ADMIN])

  """
  Emite un token MCP de 8 h para un cliente externo (identity `createMcpToken`, D9/D15, UC-22).
  El `accessToken` se devuelve una sola vez.
  """
  createMcpToken(input: CreateMcpTokenInput): CreateMcpTokenPayload! @auth(requires: [ADMIN])

  """Revoca un token MCP antes de que expire (identity `revokeMcpToken`)."""
  revokeMcpToken(id: UUID!): RevokeMcpTokenPayload! @auth(requires: [ADMIN])
}

type Subscription {
  """Alertas nuevas (origen: `bandada.insights.alert.raised.v1`)."""
  alertRaised(
    "Severidad mínima a recibir (opcional)."
    minSeverity: AlertSeverity
  ): Alert! @auth(requires: [ADMIN])

  """
  Cambios en la cola de moderación (origen: eventos `bandada.media.asset.*`,
  `bandada.social.content.reported.v1` y `bandada.social.post.hidden.v1`, recibidos por la cola
  `admin-gateway.subscriptions.<instanceId>`).
  """
  moderationQueueChanged: ModerationQueueChange! @auth(requires: [MODERATOR, ADMIN])

  """Se emite cuando el reporte indicado termina (origen: `bandada.insights.report.ready.v1`)."""
  reportReady(id: UUID!): GeneratedReport! @auth(requires: [ADMIN])
}
