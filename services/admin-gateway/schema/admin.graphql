# =============================================================================
# Bandada U — GraphQL del panel de administración (admin-gateway)
# Versión: 1.1.0 (2026-10-14) — schema-first según D11, D13, D14 y D15 (ADR-0016).
# Servido por admin-gateway (NestJS 11 + Apollo Server 5) en /graphql
# (HTTP + WebSocket `graphql-ws` para suscripciones).
#
# Reglas:
# - Autorización por directiva @auth(requires: [...]): basta con tener UNO de los roles.
#   Sin @auth en un campo raíz => se exige sesión válida.
# - Paginación Relay (Connection / Edge / PageInfo). Los cursores son opacos y
#   corresponden al `nextCursor` de los servicios REST.
# - Límite de profundidad 7 y de complejidad (configurado en el gateway).
# - DataLoader por servicio (identity, social, media, events, wallet, insights).
# - Los errores de negocio de las mutaciones se devuelven en `errors: [UserError!]!`
#   del payload; los de autenticación/autorización como errores GraphQL con
#   `extensions.code` = UNAUTHENTICATED | FORBIDDEN.
# - Textos (`message` de UserError) localizados según `Accept-Language` (D14).
#
# Changelog
# - 1.1.0: ADR-0016/D15 — mutaciones `retrySaga` y `createMcpToken`/`revokeMcpToken`
#   (solo ADMIN); enums alineados con el modelo de dominio (`GeneratedReportStatus.READY`,
#   `AlertKind.MODERATION_ESCALATION`, `AgentKind.EXTERNAL_MCP`, `RegistrationFailureReason`,
#   `ReportReason`, `ReportResolution`, `MediaPurpose`, `SagaType`, `SagaStep`, `NotificationType`);
#   argumentos opcionales de paginación y filtro en `contentReports`, `events`, `registrations`,
#   `sagas`, `reports`, `alerts` y `agentRuns`; `University.enabled`, `MediaAsset.purpose`,
#   `ContentReport.details/resolution`, `Alert.resource/occurrences`, `AgentRun.stopReason`.
#   Los enums dejan de estar marcados como PROPUESTA.
# - 1.0.0: versión inicial.
# =============================================================================

"""Fecha y hora ISO-8601 en UTC, p. ej. `2026-10-14T15:04:05Z`."""
scalar DateTime

"""Fecha ISO-8601 sin hora, p. ej. `2026-10-14`."""
scalar Date

"""Identificador UUID (v7 generado por la aplicación)."""
scalar UUID

"""Valor JSON arbitrario (datasets, especificaciones Vega-Lite, detalles de alertas)."""
scalar JSON

"""Entero de 64 bits serializado como número JSON (créditos y contadores)."""
scalar Long

"""Exige que el usuario autenticado tenga al menos uno de los roles indicados."""
directive @auth(requires: [Role!]!) on FIELD_DEFINITION | OBJECT

