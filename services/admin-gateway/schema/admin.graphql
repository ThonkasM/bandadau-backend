  "Especificación Vega-Lite v5."
  chart: JSON
  "URL prefirmada del audio (≤ 90 s)."
  audioUrl: String
  audioDurationSeconds: Int
  agentRun: AgentRun
  failureReason: String
  createdAt: DateTime!
  completedAt: DateTime
}

type GeneratedReportEdge {
  cursor: String!
  node: GeneratedReport!
}

type GeneratedReportConnection {
  edges: [GeneratedReportEdge!]!
  pageInfo: PageInfo!
}

"""Alerta del agente de monitoreo."""
type Alert {
  id: UUID!
  severity: AlertSeverity!
  kind: AlertKind!
  message: String!
  details: JSON
  status: AlertStatus!
  "Recurso afectado (servicio, cola o autor)."
  resource: String
  "Veces que se detectó mientras seguía abierta."
  occurrences: Int!
  agentRun: AgentRun
  raisedAt: DateTime!
  acknowledgedAt: DateTime
  acknowledgedBy: User
}

"""Paso de una ejecución de agente."""
type AgentRunStep {
  index: Int!
  "LLM o TOOL_CALL."
  kind: String!
  toolName: String
  input: JSON
  outputSummary: String
  isError: Boolean!
  startedAt: DateTime!
  durationMs: Int!
}

"""Consumo de tokens del LLM."""
type TokenUsage {
  input: Long!
  output: Long!
  total: Long!
}

"""Ejecución de un agente (MonitoringAgent o ReportAgent)."""
type AgentRun {
  id: UUID!
  agent: AgentKind!
  "SCHEDULE, MANUAL o REPORT_REQUEST."
  trigger: String!
  status: AgentRunStatus!
  model: String
  toolsUsed: [String!]!
  tokens: TokenUsage
  steps: [AgentRunStep!]!
  report: GeneratedReport
  alerts: [Alert!]!
  error: String
  "Por qué terminó (p. ej. COMPLETED, MAX_STEPS, MAX_TOKENS, ERROR)."
