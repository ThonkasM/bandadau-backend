}

"""Rango de fechas resuelto."""
type DateRange {
  from: Date!
  to: Date!
}

# -----------------------------------------------------------------------------
# Moderación
# -----------------------------------------------------------------------------

"""Medio subido por un usuario."""
type MediaAsset {
  id: UUID!
  owner: User
  kind: MediaKind!
  purpose: MediaPurpose!
  status: MediaStatus!
  "URL prefirmada de vista previa (expira)."
  previewUrl: String
  thumbnailUrl: String
  tags: [String!]!
  ocrText: String
  moderation: ModerationResult
  createdAt: DateTime!
}

"""Resultado del modelo de moderación sobre un medio."""
type ModerationResult {
  decision: ModerationDecision!
  labels: [String!]!
  "Puntajes por etiqueta (0–1), p. ej. `{\"nsfw\": 0.71}`."
  scores: JSON!
  maxScore: Float!
  modelVersion: String!
}

"""Post de la red social (vista de moderación)."""
type Post {
  id: UUID!
  author: User
  text: String
  hashtags: [String!]!
  visibility: PostVisibility!
  status: PostStatus!
  media: [MediaAsset!]!
  createdAt: DateTime!
}

"""Elemento de la cola de moderación (medio marcado o post ocultado por denuncias)."""
type ModerationItem {
  "Id del elemento (id del medio o del post)."
  id: UUID!
  source: ModerationSource!
  media: MediaAsset
  post: Post
  "Denuncias abiertas asociadas."
  openReports: Int!
  enqueuedAt: DateTime!
}

type ModerationItemEdge {
  cursor: String!
  node: ModerationItem!
}

type ModerationItemConnection {
  edges: [ModerationItemEdge!]!
  pageInfo: PageInfo!
  "Total aproximado de elementos pendientes."
  totalCount: Int!
}

"""Filtro de la cola de moderación."""
input ModerationQueueFilter {
  source: ModerationSource
  kind: MediaKind
  "Solo elementos con puntaje máximo ≥ este valor."
  minScore: Float
}

"""Denuncia de contenido."""
type ContentReport {
  id: UUID!
  targetType: ContentReportTargetType!
  targetId: UUID!
  "Post denunciado (o post del comentario denunciado)."
  post: Post
  reporter: User
  reason: ReportReason!
  "Explicación opcional del denunciante."
  details: String
  status: ReportStatus!
  "Decisión del moderador (null mientras está OPEN)."
  resolution: ReportResolution
  resolutionNote: String
  createdAt: DateTime!
  resolvedAt: DateTime
  resolvedBy: User
}

"""Cambio en la cola de moderación (suscripción)."""
type ModerationQueueChange {
  type: ModerationQueueChangeType!
  item: ModerationItem!
  "Total pendiente tras el cambio."
  totalCount: Int!
}

# -----------------------------------------------------------------------------
# Eventos y SAGA
# -----------------------------------------------------------------------------

"""Evento o taller."""
type Event {
  id: UUID!
  organizer: User
  title: String!
  description: String
  coverUrl: String
  startsAt: DateTime!
  venue: String!
  capacity: Int!
  seatsTaken: Int!
  priceCredits: Long!
  status: EventStatus!
  createdAt: DateTime!
  "Inscripciones del evento."
  registrations: [Registration!]! @auth(requires: [ADMIN])
}

"""Filtro de eventos."""
input EventFilter {
  from: DateTime
  to: DateTime
  status: EventStatus
  organizerId: UUID
  query: String
}

"""Inscripción a un evento."""
type Registration {
  id: UUID!
  eventId: UUID!
  user: User
  status: RegistrationStatus!
  failureReason: RegistrationFailureReason
  saga: SagaInstance
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Instancia de SAGA de inscripción o cancelación."""
type SagaInstance {
  id: UUID!
  registrationId: UUID!
  type: SagaType!
  "Paso actual o último ejecutado."
  step: SagaStep!
  status: SagaStatus!
  deadlineAt: DateTime
  failureReason: RegistrationFailureReason
  "Reintentos del comando del paso actual."
  retries: Int!
  startedAt: DateTime!
  updatedAt: DateTime!
}

