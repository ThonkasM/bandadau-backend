  DARK
}

"""Visibilidad de un post."""
enum PostVisibility {
  PUBLIC
  FOLLOWERS
  GROUP
}

"""Estado de un post."""
enum PostStatus {
  PENDING_MEDIA
  PUBLISHED
  HIDDEN
  REMOVED
}

"""Tipo de reacción."""
enum ReactionType {
  LIKE
  HELPFUL
  FUNNY
  SUPPORT
}

"""Privacidad de un grupo."""
enum GroupPrivacy {
  PUBLIC
  PRIVATE
}

"""Estado de una membresía de grupo."""
enum MembershipStatus {
  PENDING
  ACTIVE
  REJECTED
  LEFT
}

"""Tipo de medio."""
enum MediaKind {
  IMAGE
  VIDEO
}

"""Estado de un medio."""
enum MediaStatus {
  PENDING_UPLOAD
  PROCESSING
  APPROVED
  FLAGGED
  REJECTED
}

"""Decisión automática del modelo de moderación."""
enum ModerationDecision {
  ALLOW
  REVIEW
  BLOCK
}

"""Estado de una denuncia de contenido."""
enum ReportStatus {
